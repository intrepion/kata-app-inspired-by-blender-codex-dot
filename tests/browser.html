<!doctype html><html><head><meta charset="utf-8"><title>Formyard browser checks</title><style>body{font:15px Arial;background:#f4f4ea;color:#253e2f;padding:24px}iframe{width:1100px;height:850px;border:1px solid #aaa}li{padding:5px}.pass{color:#21663a}.fail{color:#b22624}</style></head><body><h1>Formyard browser checks</h1><p id="summary">Running…</p><ol id="results"></ol><iframe src="../?test=1" title="App under test"></iframe><script type="module">
const frame=document.querySelector('iframe'),results=document.querySelector('#results');let passed=0,failed=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function check(name,condition){let li=document.createElement('li');li.className=condition?'pass':'fail';li.textContent=(condition?'PASS: ':'FAIL: ')+name;results.append(li);condition?passed++:failed++;}
frame.addEventListener('load',async()=>{await wait(100);const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);const click=id=>$(id).click(),change=(el,value)=>{el.value=value;el.dispatchEvent(new w.Event('change',{bubbles:true}));};
try{
check('Starter contains five scene objects',d.querySelectorAll('.object').length===5);check('Canvas has rendered pixels',!!$('viewport').getContext('2d').getImageData(300,300,1,1).data[3]);
d.querySelector('[data-add="cube"]').click();check('Add cube selects sixth object',d.querySelectorAll('.object').length===6&&$('name').value==='Cube');
change($('name'),'QA cube');check('Rename uses visible text',d.querySelector('.object.active').textContent.includes('QA cube'));
change(d.querySelector('[aria-label="Position X"]'),'2.5');check('Position accepts numeric transform',d.querySelector('[aria-label="Position X"]').value==='2.5');
change(d.querySelector('[aria-label="Scale X"]'),'-1');check('Scale clamps invalid negative value',d.querySelector('[aria-label="Scale X"]').value==='0.1');
click('duplicate');check('Duplicate creates independent object',d.querySelectorAll('.object').length===7&&$('name').value==='QA cube copy');
click('delete');check('Delete removes selected object',d.querySelectorAll('.object').length===6);click('undo');check('Undo restores deleted object',d.querySelectorAll('.object').length===7);click('redo');check('Redo deletes restored object',d.querySelectorAll('.object').length===6);
click('wire');check('Wire overlay toggles state',$('wire').getAttribute('aria-pressed')==='true');click('solid');check('Solid mode resets state',$('wire').getAttribute('aria-pressed')==='false');
$('visible').checked=false;$('visible').dispatchEvent(new w.Event('change'));check('Visibility hides object in collection',d.querySelector('.object.active').textContent.includes('hidden'));click('undo');
let exportName,exportText;d.addEventListener('click',e=>{if(e.target.tagName==='A'&&e.target.download){exportName=e.target.download;exportText=fetch(e.target.href).then(r=>r.text());e.preventDefault();}},true);click('export');check('OBJ export prepares file',exportName==='formyard-scene.obj');click('save');check('Editable project export prepares file',exportName==='my-scene.formyard');
click('new');check('New scene is empty and inspector hidden',d.querySelectorAll('.object').length===0&&$('inspector').hidden);click('undo');check('New scene remains undoable',d.querySelectorAll('.object').length===6);
let dt=new w.DataTransfer();dt.items.add(new w.File(['{}'],'invalid.formyard',{type:'application/json'}));$('file').files=dt.files;$('file').dispatchEvent(new w.Event('change'));await wait(30);check('Malformed project rejected without losing scene',$('status').textContent.includes('Could not open')&&d.querySelectorAll('.object').length===6);
click('save');let validText=await exportText;let good=new w.DataTransfer();good.items.add(new w.File([validText],'valid.formyard',{type:'application/json'}));$('file').files=good.files;$('file').dispatchEvent(new w.Event('change'));await wait(30);check('Valid project reopens correctly',$('status').textContent==='Project opened.'&&d.querySelectorAll('.object').length===6);
const oldConfirm=w.confirm;w.confirm=()=>false;click('new');check('Cancelled new scene preserves the scene',d.querySelectorAll('.object').length===6);w.confirm=oldConfirm;
click('fit');check('Frame command does not produce invalid canvas',$('viewport').width>0);
check('Tool Shed backlink correct',d.querySelector('.shed').href==='https://intrepion.github.io/tools/');
}catch(e){check('Unexpected browser exception: '+e.message,false);}
document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;});
</script></body></html>
